- insert:
    - id: api-key-pool
      name: dsh-api-key-pool
      inject: [llm, webServer, settings]
      config:
        pools: {}
        defaultCooldownMs: 30000
        maxRetriesPerTurn: 5
        requireAuthForMutations: true
        # Allow Settings/Models via --trusted-host (not only localhost).
        enableRemoteHostSettings: true
